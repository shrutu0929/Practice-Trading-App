services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tradedesk
      DATABASE_USERNAME: tradedesk
      DATABASE_PASSWORD: tradedesk
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-key-change-before-deploying-123456}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradedesk
      POSTGRES_USER: tradedesk
      POSTGRES_PASSWORD: tradedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradedesk -d tradedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
